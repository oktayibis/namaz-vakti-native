name: NamazVakti
options:
  bundleIdPrefix: com.okib
  minimumXcodeGenVersion: 2.28.0

packages:
  Adhan:
    url: https://github.com/batoulapps/Adhan-Swift
    from: 1.2.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0

settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: "3SN795A9D6"
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    # Automatic signing picks the actual certificate at build/export time: Development
    # for local builds, Distribution when exporting the archive for the App Store.
    # "Apple Development" is what Xcode itself writes for both configs under automatic
    # signing — pinning "Apple Distribution" here instead makes the archive fail with
    # "conflicting provisioning settings". The point of setting it at all is to displace
    # the legacy "iPhone Developer" value XcodeGen injects by default.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"

schemes:
  NamazVakti:
    build:
      targets:
        NamazVakti: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  NamazVakti:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: NamazVakti/NamazVakti
    settings:
      base:
        INFOPLIST_FILE: NamazVakti/NamazVakti/Info.plist
        CODE_SIGN_ENTITLEMENTS: NamazVakti/NamazVakti/NamazVakti.entitlements
      # XcodeGen's application preset injects the legacy "iPhone Developer" identity at
      # target level, which outranks the project-level setting above.
      configs:
        debug:
          CODE_SIGN_IDENTITY: "Apple Development"
        release:
          CODE_SIGN_IDENTITY: "Apple Development"
    dependencies:
      - package: Adhan
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
      - target: NamazVaktiWidget
    postBuildScripts:
      - script: |
          RUN_SCRIPT="${BUILD_DIR%Build/*}SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          if [ -f "$RUN_SCRIPT" ]; then
            "$RUN_SCRIPT"
          fi
        name: "[Crashlytics] Run Script"
        inputFiles:
          - "${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}"
          - "${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${TARGET_NAME}"
          - "${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist"
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist"
          - "$(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)"
        basedOnDependencyAnalysis: false

  NamazVaktiWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: NamazVaktiWidget
      - path: NamazVakti/NamazVakti/Models/LocationData.swift
      - path: NamazVakti/NamazVakti/Services/PrayerCalculator.swift
      # The app's .lproj bundles, so the widget can localize its gallery entry and
      # prayer names from its own Bundle.main instead of shipping Turkish literals.
      # LanguageManager itself is deliberately NOT compiled here: it depends on
      # AnalyticsService/Firebase, which must not be pulled into the extension.
      - path: NamazVakti/NamazVakti/Resources
    settings:
      base:
        INFOPLIST_FILE: NamazVaktiWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: NamazVaktiWidget/NamazVaktiWidget.entitlements
        # Extension bundle ids must be prefixed by the host app's bundle id
        PRODUCT_BUNDLE_IDENTIFIER: com.okib.NamazVakti.NamazVaktiWidget
    dependencies:
      - package: Adhan
