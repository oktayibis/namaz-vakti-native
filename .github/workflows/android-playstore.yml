name: Android Release to Google Play

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play destination track"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      release_status:
        description: "Google Play release status (use 'draft' if app is not yet published)"
        required: false
        default: "completed"
        type: choice
        options:
          - completed
          - draft
          - halted
          - inProgress
      version_name:
        description: "Optional versionName override (e.g. 1.0.0). Extracted from tag if empty."
        required: false
        type: string
      version_code:
        description: "Optional versionCode override (e.g. 42). Defaults to github.run_number if empty."
        required: false
        type: string
      upload_to_play_store:
        description: "Deploy signed AAB to Google Play Console"
        required: false
        default: true
        type: boolean

concurrency:
  group: android-playstore-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-android:
    name: Build Signed AAB & Upload to Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle with cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Resolve Version Name and Version Code
        id: version
        run: |
          INPUT_VN="${{ github.event.inputs.version_name }}"
          REF_NAME="${{ github.ref_name }}"
          if [ -n "$INPUT_VN" ]; then
            VERSION_NAME="$INPUT_VN"
          elif [[ "$REF_NAME" == android-v* ]]; then
            VERSION_NAME="${REF_NAME#android-v}"
          elif [[ "$REF_NAME" == v* ]]; then
            VERSION_NAME="${REF_NAME#v}"
          else
            VERSION_NAME=""
          fi

          INPUT_VC="${{ github.event.inputs.version_code }}"
          if [ -n "$INPUT_VC" ]; then
            VERSION_CODE="$INPUT_VC"
          else
            VERSION_CODE="${{ github.run_number }}"
          fi

          echo "Resolved ANDROID_VERSION_NAME=${VERSION_NAME:-default}, ANDROID_VERSION_CODE=$VERSION_CODE"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Check Android Signing & Google Play Secrets
        id: secrets_check
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          UPLOAD_REQUESTED: ${{ github.event_name == 'push' || github.event.inputs.upload_to_play_store != 'false' }}
        run: |
          HAS_KEYSTORE="true"
          for VAR in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [ -z "${!VAR}" ]; then
              HAS_KEYSTORE="false"
            fi
          done

          if [ "$HAS_KEYSTORE" = "false" ]; then
            if [ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
              echo "::error::Missing Android keystore secrets (ANDROID_KEYSTORE_BASE64 / PASSWORD / ALIAS) required for Google Play upload."
              exit 1
            else
              echo "::warning::Android upload keystore secrets are not configured yet; building release bundle with fallback signing config."
            fi
          fi

          SHOULD_UPLOAD_PLAY="false"
          if [ "$UPLOAD_REQUESTED" = "true" ]; then
            if [ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
              SHOULD_UPLOAD_PLAY="true"
            else
              echo "::notice::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not configured yet (Google Play developer account verification pending). Building .aab artifact and skipping Google Play Console upload."
            fi
          fi

          echo "has_keystore=$HAS_KEYSTORE" >> "$GITHUB_OUTPUT"
          echo "should_upload_play=$SHOULD_UPLOAD_PLAY" >> "$GITHUB_OUTPUT"

      - name: Decode Upload Keystore
        id: keystore
        if: ${{ steps.secrets_check.outputs.has_keystore == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_FILE="${RUNNER_TEMP}/upload-keystore.jks"
          echo -n "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "::error::Decoded keystore file is empty. Verify ANDROID_KEYSTORE_BASE64."
            exit 1
          fi
          echo "path=$KEYSTORE_FILE" >> "$GITHUB_OUTPUT"

      - name: Run Unit Tests Before Release Packaging
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Signed Release Bundle (.aab)
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload Signed AAB & R8 Mapping Artifact
        uses: actions/upload-artifact@v4
        with:
          name: namaz-vakti-android-release-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: Deploy AAB to Google Play Console
        if: ${{ steps.secrets_check.outputs.should_upload_play == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.oktay.namaz
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: ${{ github.event.inputs.release_status || 'completed' }}
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt

      - name: Clean Up Decoded Keystore
        if: always()
        run: rm -f "${{ runner.temp }}/upload-keystore.jks"
