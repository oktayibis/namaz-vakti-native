name: iOS Release to TestFlight

on:
  push:
    tags:
      - "ios-v*"
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version (CFBundleShortVersionString, e.g. 1.0.0). Leave empty to use project.yml or tag."
        required: false
        type: string
      build_number:
        description: "Build number (CFBundleVersion, e.g. 42). Defaults to github.run_number if empty."
        required: false
        type: string
      upload_to_testflight:
        description: "Upload signed IPA to App Store Connect / TestFlight"
        required: false
        default: true
        type: boolean

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-ios:
    name: Archive, Sign & Upload to TestFlight
    runs-on: macos-14
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ./ios

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ios/DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('ios/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Resolve Version and Build Number
        id: version
        run: |
          # 1. Determine Marketing Version
          INPUT_VERSION="${{ github.event.inputs.version }}"
          REF_NAME="${{ github.ref_name }}"
          if [ -n "$INPUT_VERSION" ]; then
            MARKETING_VERSION="$INPUT_VERSION"
          elif [[ "$REF_NAME" == ios-v* ]]; then
            MARKETING_VERSION="${REF_NAME#ios-v}"
          elif [[ "$REF_NAME" == v* ]]; then
            MARKETING_VERSION="${REF_NAME#v}"
          else
            MARKETING_VERSION=$(grep -E "MARKETING_VERSION:" project.yml | head -n1 | awk '{print $2}' | tr -d '"'\''')
          fi

          # 2. Determine Build Number
          INPUT_BUILD="${{ github.event.inputs.build_number }}"
          if [ -n "$INPUT_BUILD" ]; then
            BUILD_NUMBER="$INPUT_BUILD"
          else
            BUILD_NUMBER="${{ github.run_number }}"
          fi

          echo "Resolved MARKETING_VERSION=$MARKETING_VERSION, CURRENT_PROJECT_VERSION=$BUILD_NUMBER"
          echo "marketing_version=$MARKETING_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Validate Required GitHub Secrets & Determine Signing Mode
        id: secrets_check
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          IOS_BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          MISSING=0
          for VAR in \
            APPLE_TEAM_ID \
            APP_STORE_CONNECT_API_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_API_KEY_BASE64 \
            IOS_BUILD_CERTIFICATE_BASE64 \
            IOS_P12_PASSWORD; do
            if [ -z "${!VAR}" ]; then
              echo "::error::Missing required GitHub Secret: $VAR (see RELEASE_GUIDE.md)"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            exit 1
          fi

          if [ -n "$IOS_PROVISIONING_PROFILE_BASE64" ] && [ -n "$IOS_WIDGET_PROVISIONING_PROFILE_BASE64" ]; then
            echo "Signing Mode: MANUAL (using IOS_PROVISIONING_PROFILE_BASE64 & IOS_WIDGET_PROVISIONING_PROFILE_BASE64)"
            echo "signing_mode=manual" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Signing Mode: AUTOMATIC (Xcode -allowProvisioningUpdates with App Store Connect API Key)"
            echo "signing_mode=automatic" >> "$GITHUB_OUTPUT"
          fi

      - name: Install App Store Connect API Key (.p8)
        id: asc_key
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          ASC_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$ASC_DIR"
          KEY_PATH="$ASC_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode -o "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "key_path=$KEY_PATH" >> "$GITHUB_OUTPUT"

      - name: Install Signing Certificate and Provisioning Profiles
        id: signing
        env:
          SIGNING_MODE: ${{ steps.secrets_check.outputs.signing_mode }}
          IOS_BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASS=$(openssl rand -base64 32)
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"

          # Decode certificate
          echo -n "$IOS_BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          # Create and configure temporary keychain
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          # Import .p12 certificate and allow codesign access without UI prompt
          security import "$CERT_PATH" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          if [ "$SIGNING_MODE" = "manual" ]; then
            MAIN_PP_TEMP="$RUNNER_TEMP/main.mobileprovision"
            WIDGET_PP_TEMP="$RUNNER_TEMP/widget.mobileprovision"
            PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

            echo -n "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$MAIN_PP_TEMP"
            echo -n "$IOS_WIDGET_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$WIDGET_PP_TEMP"

            mkdir -p "$PP_DIR"
            MAIN_PLIST="$RUNNER_TEMP/main_pp.plist"
            WIDGET_PLIST="$RUNNER_TEMP/widget_pp.plist"
            security cms -D -i "$MAIN_PP_TEMP" > "$MAIN_PLIST"
            security cms -D -i "$WIDGET_PP_TEMP" > "$WIDGET_PLIST"

            MAIN_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$MAIN_PLIST")
            MAIN_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$MAIN_PLIST")
            WIDGET_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$WIDGET_PLIST")
            WIDGET_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$WIDGET_PLIST")

            cp "$MAIN_PP_TEMP" "$PP_DIR/$MAIN_UUID.mobileprovision"
            cp "$WIDGET_PP_TEMP" "$PP_DIR/$WIDGET_UUID.mobileprovision"

            echo "Installed Main App Profile: $MAIN_NAME ($MAIN_UUID)"
            echo "Installed Widget Profile:   $WIDGET_NAME ($WIDGET_UUID)"

            echo "main_uuid=$MAIN_UUID" >> "$GITHUB_OUTPUT"
            echo "main_name=$MAIN_NAME" >> "$GITHUB_OUTPUT"
            echo "widget_uuid=$WIDGET_UUID" >> "$GITHUB_OUTPUT"
            echo "widget_name=$WIDGET_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "Automatic provisioning active: Xcode will fetch/manage App Store profiles via App Store Connect API Key."
          fi

      - name: Configure project.yml for Release Signing & Generate Xcode Project
        env:
          SIGNING_MODE: ${{ steps.secrets_check.outputs.signing_mode }}
          MARKETING_VERSION: ${{ steps.version.outputs.marketing_version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAIN_UUID: ${{ steps.signing.outputs.main_uuid }}
          WIDGET_UUID: ${{ steps.signing.outputs.widget_uuid }}
        run: |
          python3 - << 'PYEOF'
          import os, re

          with open("project.yml", "r", encoding="utf-8") as f:
              content = f.read()

          signing_mode = os.environ.get("SIGNING_MODE", "automatic")
          mv = os.environ["MARKETING_VERSION"]
          bn = os.environ["BUILD_NUMBER"]
          team = os.environ["APPLE_TEAM_ID"]

          content = re.sub(r"MARKETING_VERSION:\s*.*", f"MARKETING_VERSION: {mv}", content)
          content = re.sub(r"CURRENT_PROJECT_VERSION:\s*.*", f"CURRENT_PROJECT_VERSION: {bn}", content)
          content = re.sub(r'DEVELOPMENT_TEAM:\s*".*"', f'DEVELOPMENT_TEAM: "{team}"', content)

          if signing_mode == "manual":
              main_uuid = os.environ["MAIN_UUID"]
              widget_uuid = os.environ["WIDGET_UUID"]
              content = re.sub(r'CODE_SIGN_STYLE:\s*Automatic', 'CODE_SIGN_STYLE: Manual', content)
              content = re.sub(r'CODE_SIGN_IDENTITY:\s*"Apple Development"', 'CODE_SIGN_IDENTITY: "Apple Distribution"', content)
              content = content.replace(
                  "CODE_SIGN_ENTITLEMENTS: NamazVakti/NamazVakti/NamazVakti.entitlements",
                  f'CODE_SIGN_ENTITLEMENTS: NamazVakti/NamazVakti/NamazVakti.entitlements\n        PROVISIONING_PROFILE_SPECIFIER: "{main_uuid}"'
              )
              content = content.replace(
                  "CODE_SIGN_ENTITLEMENTS: NamazVaktiWidget/NamazVaktiWidget.entitlements",
                  f'CODE_SIGN_ENTITLEMENTS: NamazVaktiWidget/NamazVaktiWidget.entitlements\n        PROVISIONING_PROFILE_SPECIFIER: "{widget_uuid}"'
              )

          with open("project.yml", "w", encoding="utf-8") as f:
              f.write(content)
          PYEOF

          xcodegen generate

      - name: Generate ExportOptions.plist
        env:
          SIGNING_MODE: ${{ steps.secrets_check.outputs.signing_mode }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAIN_UUID: ${{ steps.signing.outputs.main_uuid }}
          WIDGET_UUID: ${{ steps.signing.outputs.widget_uuid }}
        run: |
          mkdir -p build
          if [ "$SIGNING_MODE" = "manual" ]; then
            cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>export</string>
              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>uploadSymbols</key>
              <true/>
              <key>manageAppVersionAndBuildNumber</key>
              <false/>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.okib.NamazVakti</key>
                  <string>${MAIN_UUID}</string>
                  <key>com.okib.NamazVakti.NamazVaktiWidget</key>
                  <string>${WIDGET_UUID}</string>
              </dict>
          </dict>
          </plist>
          EOF
          else
            cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>export</string>
              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadSymbols</key>
              <true/>
              <key>manageAppVersionAndBuildNumber</key>
              <false/>
          </dict>
          </plist>
          EOF
          fi

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project NamazVakti.xcodeproj \
            -scheme NamazVakti \
            -clonedSourcePackagesDirPath DerivedData/SourcePackages

      - name: Archive iOS App (.xcarchive)
        env:
          SIGNING_MODE: ${{ steps.secrets_check.outputs.signing_mode }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MARKETING_VERSION: ${{ steps.version.outputs.marketing_version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          ASC_KEY_PATH: ${{ steps.asc_key.outputs.key_path }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          EXTRA_ARGS=()
          if [ "$SIGNING_MODE" = "automatic" ]; then
            EXTRA_ARGS+=(
              -allowProvisioningUpdates
              -authenticationKeyPath "$ASC_KEY_PATH"
              -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID"
              -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
            )
          fi

          xcodebuild archive \
            -project NamazVakti.xcodeproj \
            -scheme NamazVakti \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/NamazVakti.xcarchive \
            -clonedSourcePackagesDirPath DerivedData/SourcePackages \
            "${EXTRA_ARGS[@]}" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            MARKETING_VERSION="${MARKETING_VERSION}" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}"

      - name: Export Signed IPA
        env:
          SIGNING_MODE: ${{ steps.secrets_check.outputs.signing_mode }}
          ASC_KEY_PATH: ${{ steps.asc_key.outputs.key_path }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          EXTRA_ARGS=()
          if [ "$SIGNING_MODE" = "automatic" ]; then
            EXTRA_ARGS+=(
              -allowProvisioningUpdates
              -authenticationKeyPath "$ASC_KEY_PATH"
              -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID"
              -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
            )
          fi

          xcodebuild -exportArchive \
            -archivePath build/NamazVakti.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            "${EXTRA_ARGS[@]}"

      - name: Upload Signed IPA & dSYMs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: namaz-vakti-ios-${{ steps.version.outputs.marketing_version }}-${{ steps.version.outputs.build_number }}
          path: |
            ios/build/export/*.ipa
            ios/build/NamazVakti.xcarchive/dSYMs
          if-no-files-found: error
          retention-days: 30

      - name: Upload IPA to TestFlight via App Store Connect API
        if: ${{ github.event_name == 'push' || github.event.inputs.upload_to_testflight != 'false' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA_FILE=$(find build/export -name "*.ipa" | head -n 1)
          if [ -z "$IPA_FILE" ]; then
            echo "::error::No exported .ipa file found in ios/build/export"
            exit 1
          fi
          echo "Uploading $IPA_FILE to App Store Connect / TestFlight..."
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_FILE" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --verbose

      - name: Clean Up Keychain, Certificates, and Private Keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/build_certificate.p12" \
                "$RUNNER_TEMP/main.mobileprovision" \
                "$RUNNER_TEMP/widget.mobileprovision" \
                "$RUNNER_TEMP/main_pp.plist" \
                "$RUNNER_TEMP/widget_pp.plist"
          rm -rf "$HOME/.appstoreconnect/private_keys"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision || true
